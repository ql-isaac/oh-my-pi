<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<meta name="color-scheme" content="light dark" />
	<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf7fc" />
	<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0f0b14" />
	<title>omp — agent web ui</title>
	<script>
		(function() {
			try {
				var stored = localStorage.getItem("omp-web-theme");
				var system = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
				var theme = stored === "light" || stored === "dark" ? stored : system;
				document.documentElement.dataset.theme = theme;
				document.documentElement.style.colorScheme = theme;
			} catch(e) {}
		})();
	</script>
	<style>
		/* Minimal reset */
		*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
		html, body, #root { height: 100%; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background: var(--bg);
			color: var(--fg);
			overflow: hidden;
		}
		:root { --bg: #faf7fc; --bg-alt: #f0ecf3; --fg: #1a1420; --fg-dim: #6b5f73; --border: #e2dce6; --accent: #7c3aed; --accent-dim: #a78bfa; --danger: #ef4444; }
		[data-theme="dark"] { --bg: #0f0b14; --bg-alt: #1a1524; --fg: #e8e0f0; --fg-dim: #9a8ea8; --border: #2a2238; --accent: #a78bfa; --accent-dim: #7c3aed; --danger: #f87171; }
	</style>
	<link rel="stylesheet" href="./styles.css">
	<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ctext y='14' font-size='14'%3E%F0%9F%A7%A0%3C/text%3E%3C/svg%3E">
</head>
<body>
	<div id="root"></div>
	<script type="module" src="./main.tsx"></script>
</body>
</html>
